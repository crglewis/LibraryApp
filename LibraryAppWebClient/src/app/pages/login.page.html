<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Library App</h1>
    <h2 class="auth-subtitle">Login</h2>

    <form (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
          minlength="6"
          autocomplete="current-password"
        />
      </div>

      <small *ngIf="error" class="error-message">{{ error }}</small>

      <button type="submit" [disabled]="loginInProgress" class="btn-primary">
        {{ loginInProgress ? 'Logging in…' : 'Login' }}
      </button>

      <p class="switch-link">Don't have an account? <a routerLink="/register">Register here</a></p>
    </form>
  </div>
</div>
