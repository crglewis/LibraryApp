<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Library App</h1>
    <h2 class="auth-subtitle">Create Account</h2>

    <form (ngSubmit)="register()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Create a password (min 6 chars)"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <small *ngIf="error" class="error-message">{{ error }}</small>

      <div class="role-selection">
        <label>Your Role</label>
        <div class="role-options">
          <label for="role-Customer" class="role-option">
            <input type="radio" name="role" value="Customer" [(ngModel)]="selectedRole" id="role-Customer" />
            <span>Customer</span>
          </label>

          <label for="role-Librarian" class="role-option">
            <input type="radio" name="role" value="Librarian" [(ngModel)]="selectedRole" id="role-Librarian" />
            <span>Librarian</span>
          </label>
        </div>
      </div>

      <button type="submit" [disabled]="submitting" class="btn-primary btn-full">
        {{ submitting ? 'Creating account…' : 'Register' }}
      </button>

      <p class="switch-link">Already have an account? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
</div>
